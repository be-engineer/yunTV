name: Update downloads chart

on:
  schedule:
    # 每天 UTC 09:23 (北京时间 17:23) 刷新一次
    - cron: "23 9 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-chart
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate downloads chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python .github/scripts/update_downloads_chart.py

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images README.md
          if git diff --cached --quiet; then
            echo "图表无变化, 跳过提交"
            exit 0
          fi
          git commit -m "chore: update downloads chart"
          git pull --rebase origin main
          git push origin HEAD:main
